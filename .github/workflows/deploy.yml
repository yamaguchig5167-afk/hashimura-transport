name: GitHub Pages デプロイ

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリチェックアウト
        uses: actions/checkout@v4

      - name: GitHub Pages セットアップ
        uses: actions/configure-pages@v4

      # 公開するのはサイトのファイルだけ。CLAUDE.md・README・gas・scripts・.claude は配信しない
      - name: 公開用ファイルだけを集める
        run: |
          mkdir _site
          cp *.html favicon.ico CNAME robots.txt sitemap.xml _site/
          cp -r css js images _site/
          find _site -name '*.md' -delete

      - name: ファイルアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
