name: GitHub Pages デプロイ

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリチェックアウト
        uses: actions/checkout@v4

      - name: GitHub Pages セットアップ
        uses: actions/configure-pages@v4

      - name: ファイルアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
